<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ytbla</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      body.idle, body.idle * { cursor: none !important; }
      #player { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; }
      /* Swallows mouse input so YouTube never shows hover overlays. */
      #shield { position: fixed; inset: 0; z-index: 10; }

      #controls {
        position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
        z-index: 20; display: flex; align-items: center; gap: 12px;
        padding: 8px 14px; border-radius: 999px;
        background: rgba(20, 20, 20, 0.72); backdrop-filter: blur(12px);
        color: #fff; font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
        opacity: 1; transition: opacity 0.25s;
        user-select: none;
      }
      body.idle #controls { opacity: 0; pointer-events: none; }
      #controls button {
        all: unset; cursor: pointer; width: 28px; height: 28px;
        display: grid; place-items: center; border-radius: 50%;
      }
      #controls button:hover { background: rgba(255, 255, 255, 0.15); }
      #controls button:focus-visible { outline: 2px solid #fff; }
      #controls svg { width: 18px; height: 18px; fill: #fff; }
      #volume { width: 110px; accent-color: #fff; cursor: pointer; }
      #volume-label { min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <div id="shield"></div>
    <div id="controls">
      <button id="play" aria-label="Pause"></button>
      <button id="mute" aria-label="Mute"></button>
      <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume" />
      <span id="volume-label"></span>
      <button id="fullscreen" aria-label="Toggle full screen">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
    <script>
      const VIDEO_ID = '__VIDEO_ID__';
      const ICONS = {
        play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
        pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',
        muted: '<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>',
        low: '<svg viewBox="0 0 24 24"><path d="M18.5 12A4.5 4.5 0 0 0 16 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>',
        high: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
      };

      const $ = (id) => document.getElementById(id);
      const saved = window.ytbla.settings();
      const state = {
        volume: Number.isFinite(saved.volume) ? saved.volume : 80,
        muted: !!saved.muted,
        playing: true,
      };
      let player;
      let audioSynced = false;

      function render() {
        const effective = state.muted ? 0 : state.volume;
        $('volume').value = effective;
        $('volume-label').textContent = `${effective}%`;
        $('mute').innerHTML = effective === 0 ? ICONS.muted : effective < 50 ? ICONS.low : ICONS.high;
        $('mute').setAttribute('aria-label', state.muted ? 'Unmute' : 'Mute');
        $('play').innerHTML = state.playing ? ICONS.pause : ICONS.play;
        $('play').setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
      }

      function applyAudio() {
        if (player && player.setVolume) {
          player.setVolume(state.volume);
          state.muted ? player.mute() : player.unMute();
        }
        window.ytbla.saveSettings({ volume: state.volume, muted: state.muted });
        render();
      }

      function setVolume(v) {
        state.volume = Math.max(0, Math.min(100, Math.round(v)));
        state.muted = state.volume === 0;
        applyAudio();
      }

      function toggleMute() {
        if (state.muted && state.volume === 0) state.volume = 50;
        state.muted = !state.muted;
        applyAudio();
      }

      function togglePlay() {
        if (!player) return;
        state.playing ? player.pauseVideo() : player.playVideo();
      }

      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          videoId: VIDEO_ID,
          width: '100%',
          height: '100%',
          playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            modestbranding: 1,
            playsinline: 1,
            rel: 0,
            cc_load_policy: 0,
            origin: location.origin,
          },
          events: {
            onReady: (e) => {
              applyAudio();
              e.target.setPlaybackQuality('highres');
              e.target.playVideo();
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.PLAYING) {
                // YouTube restores its own stored volume when playback starts.
                if (!state.playing || !audioSynced) applyAudio();
                audioSynced = true;
                state.playing = true;
              } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) state.playing = false;
              render();
            },
          },
        });
      }

      $('play').addEventListener('click', togglePlay);
      $('mute').addEventListener('click', toggleMute);
      $('volume').addEventListener('input', (e) => setVolume(e.target.valueAsNumber));
      $('fullscreen').addEventListener('click', () => window.ytbla.toggleFullscreen());
      let clickTimer;
      $('shield').addEventListener('click', () => {
        clearTimeout(clickTimer);
        clickTimer = setTimeout(togglePlay, 250);
      });
      $('shield').addEventListener('dblclick', () => {
        clearTimeout(clickTimer);
        window.ytbla.toggleFullscreen();
      });

      let wheelDelta = 0;
      document.addEventListener('wheel', (e) => {
        // macOS turns Shift + vertical wheel into horizontal scroll.
        const delta = e.shiftKey && Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        wheelDelta += delta;
        if (Math.abs(wheelDelta) < 40) return;
        setVolume(state.volume - Math.sign(wheelDelta) * (e.shiftKey ? 1 : 5));
        wheelDelta = 0;
        wake();
      }, { passive: true });

      let idleTimer;
      function wake() {
        document.body.classList.remove('idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          if (!$('controls').matches(':hover')) document.body.classList.add('idle');
          else wake();
        }, 2500);
      }
      document.addEventListener('mousemove', wake);
      document.addEventListener('mouseleave', () => document.body.classList.add('idle'));

      document.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const handled = {
          Space: togglePlay,
          KeyK: togglePlay,
          KeyM: toggleMute,
          ArrowUp: () => setVolume(state.volume + 5),
          ArrowDown: () => setVolume(state.volume - 5),
          ArrowRight: () => player && player.seekTo(player.getCurrentTime() + 10, true),
          ArrowLeft: () => player && player.seekTo(Math.max(0, player.getCurrentTime() - 10), true),
        }[e.code];
        if (handled) {
          e.preventDefault();
          handled();
          wake();
        }
      });

      render();
      wake();
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
