name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt', 'LICENSE', 'docs/**', '.gitignore']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          version="${major#v}.${minor}.$((patch + 1))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag and create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --draft --verify-tag --generate-notes --title "$VERSION"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "v${{ needs.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
